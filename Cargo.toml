[package]
name = "starkom-plonk"
version = "1.0.1"
description = "The PLONK arithmetization scheme used in Starkom."
license = "Apache-2.0"
repository = "https://github.com/libernet-xyz/plonk.git"
readme = "README.md"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
ff = "0.13.1"
primitive-types = "0.14.0"
rand_core = { version = "0.6", features = ["getrandom"] }
sha3 = "0.12.0"
starkom-bluesky = "2.1.0"
starkom-pcs = "1.0.1"
starkom-poly = "1.1.0"
