[package]
name = "starkom-plonk"
version = "7.0.0"
description = "The PLONK arithmetization scheme used in Starkom."
license = "Apache-2.0"
repository = "https://github.com/libernet-xyz/plonk.git"
readme = "README.md"
edition = "2024"

[package.metadata.docs.rs]
all-features = true

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
anyhow = "1.0.104"
primitive-types = "0.14.0"
regex = "1.13.1"
sha3 = "0.12.0"
starkom-bluesky = "3.7.2"
starkom-ff = "4.1.0"
starkom-goldilocks = "3.2.1"
starkom-koalabear = "1.1.1"
starkom-pcs = "6.1.1"
starkom-poly = "4.6.0"
starkom-schraderbrau = "1.1.1"
