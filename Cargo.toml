[package]
name = "starkom-plonk"
version = "4.6.3"
description = "The PLONK arithmetization scheme used in Starkom."
license = "Apache-2.0"
repository = "https://github.com/libernet-xyz/plonk.git"
readme = "README.md"
edition = "2024"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
anyhow = "1.0.103"
primitive-types = "0.14.0"
regex = "1.12.4"
sha3 = "0.12.0"
starkom-bluesky = "3.2.0"
starkom-ff = "2.3.0"
starkom-pcs = "4.2.0"
starkom-poly = "4.1.0"
