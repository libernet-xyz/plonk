[package]
name = "starkom-plonk"
version = "6.0.0"
description = "The PLONK arithmetization scheme used in Starkom."
license = "Apache-2.0"
repository = "https://github.com/libernet-xyz/plonk.git"
readme = "README.md"
edition = "2024"

[package.metadata.docs.rs]
all-features = true

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
anyhow = "1.0.104"
primitive-types = "0.14.0"
regex = "1.13.1"
sha3 = "0.12.0"
starkom-bluesky = "3.4.0"
starkom-ff = "3.0.0"
starkom-pcs = "5.0.0"
starkom-poly = "4.5.0"
