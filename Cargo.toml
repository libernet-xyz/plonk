[package]
name = "starkom-plonk"
version = "10.0.0"
description = "The PLONK arithmetization scheme used in Starkom."
license = "Apache-2.0"
repository = "https://github.com/libernet-xyz/plonk.git"
readme = "README.md"
edition = "2024"
links = "starkom-plonk-v10"

[package.metadata.docs.rs]
all-features = true

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
anyhow = "1.0.104"
primitive-types = "0.14.0"
prost = "0.14.4"
prost-types = "0.14.4"
regex = "1.13.1"
sha3 = "0.12.0"
starkom-bluesky = "4.0.1"
starkom-ff = "5.0.2"
starkom-goldilocks = "4.0.0"
starkom-koalabear = "2.0.0"
starkom-pcs = { version = "9.0.0", path = "../pcs" }
starkom-poly = "4.6.4"
starkom-schraderbrau = "2.0.0"

[build-dependencies]
prost-build = "0.14.4"
